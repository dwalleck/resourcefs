# Continuous integration for ResourceFS.
#
# Formatting, lints, functional tests, release-mode production budgets, and
# dependency vetting run on each supported platform. Hosted execution is
# the workflow oracle; matching command text is not proof that a job runs.

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Placement oracles compare against their pinned approved baseline.
          fetch-depth: 0

      - name: Install modern Bash for fixture operators
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Only `main` writes a cache; every branch reads one.
      #
      # Each entry is 800-900 MB and there is one per platform per branch, so
      # with three platforms and a handful of open pull requests the repository
      # sat at 10,482 MB against GitHub's 10,240 MB ceiling -- 13 caches
      # evicting each other continuously, which is why a restore was 12 seconds
      # and the compile that followed was cold anyway. Writing only from `main`
      # holds the total at three entries, and a branch still restores from
      # `main` because GitHub lets a ref read its default branch's caches.
      #
      # The trade is that a branch which changes `Cargo.lock` gets a partial
      # restore until it merges. That is the normal case for this repository's
      # branches and is cheaper than the eviction it replaces.
      - name: Cache cargo state
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install Python for repository gates
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Repository gates
        if: ${{ !cancelled() }}
        env:
          # macOS was the matrix's critical path at 60 min against Windows's 27,
          # and one target was most of the gap:
          # `atlassian_fixture_operator_contract`, 78 tests driving a
          # create/verify/cleanup lifecycle through a real subprocess. Windows
          # is fast because the target is `#![cfg(unix)]` and it skips it.
          #
          # Pull requests skip it on macOS so a review is not gated on it.
          # `main` still runs it there, which is the point: the brew-bash step
          # above exists for this contract, because
          # `scripts/atlassian-fixture-bootstrap.sh` needs Bash 4.4+ and macOS
          # ships 3.2. This is the only target proving that script runs on
          # macOS, so it moves off the critical path rather than disappearing.
          RFS_SKIP_TEST_TARGETS: ${{ (runner.os == 'macOS' && github.event_name == 'pull_request') && 'atlassian_fixture_operator_contract' || '' }}
        run: python scripts/ci-gates.py
