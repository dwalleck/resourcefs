name: Platform diagnostics
on:
  push:
jobs:
  diagnose:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Capture TLS and process failure causes
        run: cargo test -p resourcefs-sources --all-features --test http_tls_contract --test process_contract --no-fail-fast -- --nocapture
