# Continuous integration for ResourceFS.
#
# Formatting, lints, functional tests, release-mode production budgets, and
# dependency vetting run on each supported platform. Hosted execution is
# the workflow oracle; matching command text is not proof that a job runs.
#
# Each commit runs once per platform. Pull requests take their required
# `gates (<os>)` checks from the push run on the head commit instead of
# starting a second run for the same tree; branch protection already requires
# the head to be up to date with main. A newer push to a branch cancels the
# run it supersedes; main keeps every run because each merge's checks are the
# record for that commit.

name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Placement oracles compare against their pinned approved baseline.
          fetch-depth: 0

      - name: Install modern Bash for fixture operators
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo state
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install Python for repository gates
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Repository gates
        if: ${{ !cancelled() }}
        run: python scripts/ci-gates.py
