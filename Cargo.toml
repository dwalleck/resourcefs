[workspace]
resolver = "3"
members = ["crates/resourcefs-core", "crates/resourcefs-sources"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dwalleck/resourcefs"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.22.0"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
