[workspace]
resolver = "3"
members = [
    "crates/resourcefs-core",
    "crates/resourcefs-mcp",
    "crates/resourcefs-sources",
]

# Debug information dominates this workspace's build output: 86% of a test
# binary was DWARF (26 MB of .text against 221 MB of .debug_*), across 70
# integration-test binaries. `line-tables-only` keeps the file:line that
# backtraces and panic messages need -- which is all the suite consumes -- and
# drops the type and variable DWARF that nothing here reads. Dependencies get
# none at all: a backtrace through `reqwest` is not where these tests are
# debugged, and they are the bulk of the graph.
#
# `profile.test` inherits from `profile.dev`, so this covers `cargo test`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dwalleck/resourcefs"

[workspace.dependencies]
aho-corasick = "=1.1.5"
async-trait = "0.1.89"
aws-lc-rs = "1.18.0"
base64 = "0.22.1"
bytes = "1.12.1"
cap-std = "4.0.2"
directories = "6.0.0"
getrandom = "0.4.3"
# Native Git object codecs and hashes only, without repository or network machinery.
gix-hash = { version = "=0.26.2", default-features = false, features = ["sha1"] }
gix-object = { version = "=0.64.1", default-features = false, features = ["sha1"] }
globset = "=0.4.20"
# The reader-mode extractor's tokenizer. Pinned exactly, like every other
# parser crate here, because extracted Markdown feeds a content-derived
# Version Tag: a tokenizer upgrade that changed the token stream would churn
# tags for unchanged upstream documents.
html5ever = "=0.39.0"
httpdate = "=1.0.3"
ignore = "=0.4.33"
clap = { version = "4.5.47", features = ["derive"] }
rmcp = { version = "=3.1.3", features = ["macros", "server", "transport-io"] }
pcre2-sys = "=0.2.10"
regex = "=1.13.1"
# The workspace's only HTTP client. rustls (not native-tls) because the
# release binaries link statically and native-tls would pull in the system
# OpenSSL. `stream` supplies the bounded body reads. `charset` was carried
# briefly and removed: it powers `Response::text()`, which this crate never
# calls — bodies are read as bytes through `chunk()` so the accept ceiling can
# bound them — so it added an unused decoder to the egress surface. Reader mode
# refuses a non-UTF-8 charset outright rather than decoding it. Everything else
# stays off to keep the egress surface small.
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls", "stream"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.143"
serde_path_to_error = "0.1.20"
tempfile = "3.22.0"
tokio = { version = "=1.47.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
# Test-only TLS server for the loopback fixtures that prove the substrate's
# address policy and hostname-bound certificate verification. Both crates are
# already in the tree through `reqwest`, so these are dependency edges rather
# than new packages, and the versions track what `reqwest` already resolved.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs"] }
# Test-only issuance avoids both expired fixtures and native TLS lifetime limits.
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
rstest = { version = "0.27.0", default-features = false }
trybuild = "1.0.111"
url = "2.5.7"
rustix = { version = "1.1.4", features = ["fs", "process"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }
