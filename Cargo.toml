[workspace]
resolver = "3"
members = [
    "crates/resourcefs-core",
    "crates/resourcefs-mcp",
    "crates/resourcefs-sources",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dwalleck/resourcefs"

[workspace.dependencies]
async-trait = "0.1.89"
cap-std = "4.0.2"
directories = "6.0.0"
getrandom = "0.4.3"
globset = "=0.4.20"
clap = { version = "4.5.47", features = ["derive"] }
rmcp = { version = "=3.1.3", features = ["macros", "server", "transport-io"] }
pcre2-sys = "=0.2.10"
regex = "=1.13.1"
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.143"
tempfile = "3.22.0"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.7"
rustix = { version = "1.1.4", features = ["fs"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
