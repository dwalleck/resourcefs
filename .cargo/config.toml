[env]
PCRE2_SYS_STATIC = { value = "1", force = true }

[alias]
# Every ignored `live_*` smoke row; expects RFS_LIVE=1 plus the source-specific
# credential/fixture environment. `scripts/live-smoke.sh` is the usual entry point.
live = "test --workspace --all-features -- --ignored --nocapture live_"
