[package]
name = "resourcefs-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiled Source Adapters for ResourceFS"

[features]
test-support = ["resourcefs-core/test-support"]

[dependencies]
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
bytes.workspace = true
cap-std.workspace = true
directories.workspace = true
getrandom.workspace = true
gix-hash.workspace = true
gix-object.workspace = true
globset.workspace = true
html5ever.workspace = true
httpdate.workspace = true
ignore.workspace = true
pcre2-sys.workspace = true
regex.workspace = true
reqwest.workspace = true
resourcefs-core = { path = "../resourcefs-core" }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Enables this crate's own `test-support` feature for its test targets only.
# The integration tests call `test-support`-gated helpers, so without this a
# plain `cargo test` fails to compile; guarding every test file with
# `#![cfg(feature = "test-support")]` instead would make `cargo test` compile
# and then silently run nothing, which is worse than failing. A self
# dev-dependency scopes the feature to tests without changing what the shipped
# library enables by default.
resourcefs-sources = { path = ".", features = ["test-support"] }
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rstest.workspace = true

[[test]]
name = "secret_contract"
path = "tests/secret_contract.rs"
harness = false
