[package]
name = "resourcefs-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiled Source Adapters for ResourceFS"

[features]
test-support = ["resourcefs-core/test-support"]

[dependencies]
async-trait.workspace = true
cap-std.workspace = true
directories.workspace = true
getrandom.workspace = true
globset.workspace = true
ignore.workspace = true
pcre2-sys.workspace = true
regex.workspace = true
resourcefs-core = { path = "../resourcefs-core" }
sha2.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "secret_contract"
path = "tests/secret_contract.rs"
harness = false
