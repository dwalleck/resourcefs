[package]
name = "resourcefs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-neutral Behavior Contract for ResourceFS"

[features]
test-support = []

[dependencies]
aho-corasick.workspace = true
async-trait.workspace = true
getrandom.workspace = true
serde.workspace = true
sha2.workspace = true
url.workspace = true
tokio.workspace = true

[dev-dependencies]
# Enables this crate's own `test-support` feature for its test targets only.
# The integration tests call `test-support`-gated helpers, so without this a
# plain `cargo test` fails to compile; guarding every test file with
# `#![cfg(feature = "test-support")]` instead would make `cargo test` compile
# and then silently run nothing, which is worse than failing. A self
# dev-dependency scopes the feature to tests without changing what the shipped
# library enables by default.
resourcefs-core = { path = ".", features = ["test-support"] }
serde_json = "1.0.143"
trybuild.workspace = true
