[package]
name = "resourcefs-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local stdio MCP server and ResourceFS CLI"

[lib]
name = "resourcefs_mcp"

[[bin]]
name = "resourcefs"
path = "src/main.rs"

[features]
test-support = ["resourcefs-sources/test-support"]

[dependencies]
async-trait.workspace = true
clap.workspace = true
resourcefs-core = { path = "../resourcefs-core" }
resourcefs-sources = { path = "../resourcefs-sources" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
# Enables this crate's own `test-support` feature for its test targets only.
# The integration tests call `test-support`-gated helpers, so without this a
# plain `cargo test` fails to compile; guarding every test file with
# `#![cfg(feature = "test-support")]` instead would make `cargo test` compile
# and then silently run nothing, which is worse than failing. A self
# dev-dependency scopes the feature to tests without changing what the shipped
# library enables by default.
resourcefs-mcp = { path = ".", features = ["test-support"] }
cargo_metadata = "0.23.0"
tempfile.workspace = true
tokio-rustls.workspace = true
