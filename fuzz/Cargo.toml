[package]
name = "resourcefs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Structured input for `server_profile_structured`. The byte target explores the
# encoding; this explores the grammar, so the fuzzer reaches the validation and
# source-conversion layers the corpus shows it never entered.
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1.0.143"
resourcefs-core = { path = "../crates/resourcefs-core", features = ["test-support"] }
resourcefs-mcp = { path = "../crates/resourcefs-mcp" }

[[bin]]
name = "path_reference"
path = "fuzz_targets/path_reference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_profile"
path = "fuzz_targets/server_profile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_profile_structured"
path = "fuzz_targets/server_profile_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hashline_patch"
path = "fuzz_targets/hashline_patch.rs"
test = false
doc = false
bench = false

[workspace]
